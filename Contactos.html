<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astromelia Deco Contacto</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/2d7ff2711c.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="./index.html">
                 <img class="logo" src="./assets/img/Belu Astromelia.png" alt="Astromelia logo">
            </a>
            <ul class="navlist">
               <li><a href="./index.html">Inicio</a></li>
               <li><a href="./Productos.html">Productos</a></li>
               <li><a href="./Galería.html">Galería</a></li>
               <li><a href="./Contactos.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="page-title">Contacto</h1>
        <section class="main-section">
            <form action="#" method="POST">
            
                <!-- Nombre -->
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" name="nombre" id="name" placeholder="Nombre" required>
                </div>

                <!-- Apellido -->
                <div class="form-group">
                    <label for="lastname">Apellido</label>
                    <input type="text" name="apellido" id="lastname" placeholder="Apellido" required>
                </div>

                <!-- Teléfono -->
                <div class="form-group">
                    <label for="phone">Tu teléfono</label>
                    <input type="tel" name="telefono" id="phone" placeholder="+54 012 345 6789" required>
                </div>

                <!-- Email (Corregido type="email" y for="email") -->
                <div class="form-group">
                    <label for="mail">Tu e-mail</label>
                    <input type="email" name="email" id="mail" placeholder="ejemplo@correo.com" required>
                </div>

                <!-- Menú Agregado para cumplir la consigna -->
                <div class="form-group">
                    <label for="motivo">Motivo de contacto</label>
                    <select id="motivo" name="motivo" required>
                        <option value="" disabled selected>Selecciona una opción</option>
                        <option value="consulta">Consulta sobre productos</option>
                        <option value="presupuesto">Solicitar presupuesto</option>
                        <option value="otro">Otro motivo</option>
                    </select>
                </div>

                <!-- Agregado para cumplir la consigna -->
                <div class="form-group">
                    <label>Preferís que te contactemos por:</label>
                    <div style="display: flex; gap: 20px; margin-top: 8px;">
                        <label for="pref-email" style="font-weight: normal;">
                            <input type="radio" id="pref-email" name="preferencia_contacto" value="email" checked> Email
                        </label>
                        <label for="pref-whatsapp" style="font-weight: normal;">
                            <input type="radio" id="pref-whatsapp" name="preferencia_contacto" value="whatsapp"> WhatsApp
                        </label>
                    </div>
                </div>

                <!-- Mensaje -->
                <div class="form-group">
                    <label for="Comment">Mensaje</label>
                    <textarea id="Comment" name="mensaje" placeholder="Contame cómo podemos ayudarte" rows="8"></textarea>
                </div>

                <!-- Botones -->
                <div class="form-buttons">
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpiar</button>
                </div>

            </form>
        </section>
    </main>

    <footer>
        <ul class="Footer-nav">
           <li><a href="./index.html">Inicio</a></li>
           <li><a href="./Productos.html">Productos</a></li>
           <li><a href="./Galería.html">Galería</a></li>
           <li><a href="./Contactos.html">Contacto</a></li>
        </ul>
        <div class="Footer-redes">
            <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        </div>
    </footer>
    
</body>
</html>
